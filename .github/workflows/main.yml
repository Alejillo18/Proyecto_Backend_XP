name: Integración Continua - Trueque Verde

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Validar Código y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter (HU-15)
        run: npm run lint

      - name: Compilar TypeScript / Build (HU-15)
        run: npm run build

      - name: Ejecutar Tests (Unitarios y BDD) (HU-15)
        run: npm run test